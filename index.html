<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `viewport-fit=cover` makes env(safe-area-inset-*) non-zero, which the bottom transport
         needs to clear the gesture bar; `interactive-widget=resizes-content` makes the on-screen
         keyboard shrink the layout rather than cover the editor (ADR-050). -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>NoChords</title>
    <meta name="description" content="Learn songs by progressively hiding chord cues while playing through lyrics at a controlled tempo." />
    <!-- One per scheme, so the browser chrome matches the page under "system" with no script; a
         fixed choice repaints both (ADR-067). Kept in step with THEME_COLOR in lib/theme.ts. -->
    <meta name="theme-color" content="#f6f7fa" media="(prefers-color-scheme: light)" data-scheme="light" />
    <meta name="theme-color" content="#12141a" media="(prefers-color-scheme: dark)" data-scheme="dark" />
    <!-- Before anything paints: a chosen scheme goes on the root now, or the page would open in the
         device's scheme and switch a moment later when React reads the setting (ADR-067). -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('nochords.settings.v1') || '{}').theme;
        if (theme === 'light' || theme === 'dark') {
          document.documentElement.dataset.theme = theme;
          document.querySelectorAll('meta[name="theme-color"]').forEach(function (meta) {
            meta.content = theme === 'dark' ? '#12141a' : '#f6f7fa';
          });
        }
      } catch (error) {
        // No storage, or nothing readable in it: the device's own scheme is a fine answer.
      }
    </script>

    <!-- Installable on Android and iOS (ADR-028). iOS reads none of the manifest's display or
         icon fields, so it needs its own tags alongside it. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="NoChords" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2312141a'/%3E%3Ctext x='16' y='23' font-size='20' font-family='monospace' font-weight='bold' text-anchor='middle' fill='%237fd1ff'%3E%E2%99%AA%3C/text%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
